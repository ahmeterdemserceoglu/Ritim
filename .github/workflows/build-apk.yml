name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/**'
      - 'plugins/**'
      - 'package.json'
      - 'app.json'
      - '.github/workflows/build-apk.yml'

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript report
        run: npm run typecheck
        continue-on-error: true

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean
        env:
          CI: '1'
          NODE_ENV: production

      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
        env:
          NODE_ENV: production

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Ritim-latest.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ritim-Android-Release-APK
          path: Ritim-latest.apk
          retention-days: 14
          if-no-files-found: error
